<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR de la Trivia | NexusTours</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f5f3f0;color:#061a2b;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
    main{width:min(520px,100%);background:white;border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(5,26,43,.12)}
    h1{margin-top:0}label{font-weight:700;font-size:13px}input{width:100%;box-sizing:border-box;margin:8px 0 16px;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:14px}button{width:100%;padding:15px;border:0;border-radius:14px;background:#ff5a1f;color:#fff;font-weight:800;font-size:16px;cursor:pointer}#qr{display:grid;place-items:center;min-height:280px;margin-top:18px}.note{font-size:12px;line-height:1.5;color:#69747d}</style>
</head>
<body>
<main>
  <h1>QR de la trivia</h1>
  <p>Pega la URL pública de GitHub Pages y genera el QR para impresión.</p>
  <label for="url">URL pública</label>
  <input id="url" type="url" placeholder="https://usuario.github.io/nexus-mexico-trivia/" />
  <button id="make">GENERAR QR</button>
  <div id="qr"></div>
  <p class="note">Esta página es solo una herramienta de producción; no forma parte del flujo del visitante.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const input=document.getElementById('url');
const qr=document.getElementById('qr');
const guess=location.href.replace(/qr\.html(?:\?.*)?$/,'');
input.value=guess.startsWith('http')?guess:'';
document.getElementById('make').onclick=()=>{qr.innerHTML=''; if(!input.value.trim()) return; new QRCode(qr,{text:input.value.trim(),width:256,height:256,colorDark:'#061a2b',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});};
</script>
</body>
</html>
